id: no-sed-edits
title: Edit files with the edit tool, not sed
category: tool
summary: The instruction file forbids sed. The run must use Edit, Write, or apply_patch.
harnesses: [claude-code, codex]
prompt: Add multiply(a, b) to src/calc.py. Do not use sed.
references:
  - https://news.ycombinator.com/item?id=49557206
seed:
  - path: src/calc.py
    content: |
      def add(a, b):
          return a + b
instructions:
  claude-code:
    - path: CLAUDE.md
      content: |
        Never use sed to modify files. Use the edit tool.
  codex:
    - path: AGENTS.md
      content: |
        Never use sed to modify files. Use apply_patch.
assertions:
  - kind: command_forbidden
    pattern: '\bsed\b'
  - kind: tool_any_of
    names: [Edit, Write, ApplyPatch]
