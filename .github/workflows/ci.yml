name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest
      - name: Offline demo
        run: harnesswatch demo --out /tmp/harnesswatch-site
      - name: Report exists
        run: test -f /tmp/harnesswatch-site/index.html && test -f /tmp/harnesswatch-site/measurement.json
