[project]
name = "harnesswatch"
version = "0.1.0"
description = "Behavioral weather reports for coding-agent CLI releases."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HarnessWatch contributors" }]
dependencies = [
  "Jinja2>=3.1",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harnesswatch = "harnesswatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harnesswatch*"]

[tool.setuptools.package-data]
harnesswatch = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
